<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animal Spelling Adventure</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Comic Sans MS','Trebuchet MS',sans-serif}
    body{min-height:100vh;background:linear-gradient(135deg,#8ee7ff,#fff2a8 45%,#b7ffb2);overflow-x:hidden;color:#24415f}
    .cloud{position:fixed;background:#fff;border-radius:80px;opacity:.85;animation:float 18s linear infinite;z-index:0}
    .cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
    .cloud:before{width:60px;height:60px;left:25px;top:-30px}.cloud:after{width:80px;height:80px;right:25px;top:-45px}
    .c1{width:170px;height:55px;top:8%;left:-180px}.c2{width:130px;height:45px;top:30%;left:-150px;animation-duration:25s}.c3{width:200px;height:60px;top:72%;left:-220px;animation-duration:30s}
    @keyframes float{to{transform:translateX(calc(100vw + 260px))}}
    .wrap{position:relative;z-index:1;max-width:1050px;margin:auto;padding:28px 16px 40px}
    header{text-align:center;margin-bottom:18px}.badge{display:inline-block;background:#ff7cc9;color:#fff;padding:8px 18px;border-radius:999px;font-weight:900;box-shadow:0 6px 0 #cf4da0}
    h1{font-size:clamp(2rem,5vw,4rem);color:#24415f;text-shadow:3px 3px 0 #fff;margin:14px 0 6px}.sub{font-size:1.15rem;font-weight:800;color:#356280}
    .game{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:stretch}.card{background:rgba(255,255,255,.9);border:6px solid #fff;border-radius:34px;box-shadow:0 18px 35px rgba(38,79,107,.18);padding:22px;position:relative;overflow:hidden}.card:before{content:"";position:absolute;inset:8px;border:3px dashed rgba(255,124,201,.35);border-radius:25px;pointer-events:none}
    .animalBox{text-align:center}.animal{font-size:11rem;filter:drop-shadow(0 16px 0 rgba(0,0,0,.08));animation:bounce 1.8s ease-in-out infinite}.hint{font-size:1.4rem;font-weight:900;color:#ff7a00;margin-top:8px}.speak{margin-top:14px;border:none;border-radius:18px;background:#6d7cff;color:white;padding:13px 20px;font-size:1.05rem;font-weight:900;cursor:pointer;box-shadow:0 6px 0 #4654c9}.speak:active,.btn:active,.letter:active{transform:translateY(4px);box-shadow:none}
    @keyframes bounce{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
    .spellArea h2{text-align:center;margin-bottom:12px;color:#2e5777}.slots{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:18px 0;min-height:70px}.slot{width:58px;height:62px;background:#fff6d8;border:4px solid #ffcb3d;border-radius:16px;display:grid;place-items:center;font-size:2rem;font-weight:900;color:#24415f;box-shadow:0 6px 0 #e8a500}.letters{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:20px 0}.letter{width:58px;height:58px;border:none;border-radius:18px;background:#58d68d;color:white;font-size:1.8rem;font-weight:900;cursor:pointer;box-shadow:0 6px 0 #27ae60;transition:.15s}.letter.used{opacity:.25;pointer-events:none}.message{text-align:center;min-height:42px;font-size:1.4rem;font-weight:900;color:#e85a8a}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}.btn{border:none;border-radius:18px;padding:13px 18px;font-size:1rem;font-weight:900;cursor:pointer;color:white;box-shadow:0 6px 0 rgba(0,0,0,.18)}.check{background:#ff9f1c}.clear{background:#ff6b6b}.next{background:#2ec4b6}.score{margin-top:15px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.pill{background:#fff;border-radius:999px;padding:10px 16px;font-weight:900;color:#24415f;box-shadow:0 5px 0 rgba(0,0,0,.08)}
    .stars{position:absolute;inset:0;pointer-events:none}.star{position:absolute;font-size:2rem;animation:pop 1s ease-out forwards}@keyframes pop{0%{transform:scale(0) rotate(0);opacity:1}100%{transform:scale(1.6) rotate(180deg);opacity:0}}
    .footer{text-align:center;margin-top:18px;font-weight:900;color:#356280}.progress{height:16px;background:#fff;border-radius:999px;margin:18px auto 0;max-width:620px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.08)}.bar{height:100%;width:0;background:linear-gradient(90deg,#ff7cc9,#ffcb3d,#58d68d);border-radius:999px;transition:.4s}
    @media(max-width:820px){.game{grid-template-columns:1fr}.animal{font-size:8rem}.slot,.letter{width:48px;height:52px;font-size:1.55rem}.card{padding:17px}}
    @media print{.cloud,.controls,.speak{display:none}body{background:white}.card{box-shadow:none;border:2px solid #ccc}}
  </style>
</head>
<body>
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <main class="wrap">
    <header>
      <div class="badge">Kindergarten English Game</div>
      <h1>Animal Spelling Adventure</h1>
      <p class="sub">Look at the animal, listen, then spell its English name!</p>
      <div class="progress"><div class="bar" id="bar"></div></div>
    </header>
    <section class="game">
      <div class="card animalBox">
        <div class="stars" id="stars"></div>
        <div class="animal" id="animal">🐱</div>
        <div class="hint" id="hint">I say: meow!</div>
        <button class="speak" onclick="speakAnimal()">🔊 Hear Animal Name</button>
        <div class="score">
          <div class="pill">Score: <span id="score">0</span></div>
          <div class="pill">Animal: <span id="number">1</span>/<span id="total">20</span></div>
        </div>
      </div>
      <div class="card spellArea">
        <h2>Spell the word</h2>
        <div class="slots" id="slots"></div>
        <div class="letters" id="letters"></div>
        <div class="message" id="message">Tap the letters below!</div>
        <div class="controls">
          <button class="btn check" onclick="checkAnswer()">✅ Check</button>
          <button class="btn clear" onclick="clearAnswer()">↩ Clear</button>
          <button class="btn next" onclick="nextAnimal()">➡ Next</button>
        </div>
      </div>
    </section>
    <p class="footer">Teacher tip: press “Hear Animal Name” so children can repeat and spell together.</p>
  </main>
  <script>
    const animals=[
      {name:'CAT',emoji:'🐱',sound:'meow'},{name:'DOG',emoji:'🐶',sound:'woof'},{name:'COW',emoji:'🐮',sound:'moo'},{name:'PIG',emoji:'🐷',sound:'oink'},
      {name:'DUCK',emoji:'🦆',sound:'quack'},{name:'LION',emoji:'🦁',sound:'roar'},{name:'FROG',emoji:'🐸',sound:'ribbit'},{name:'BIRD',emoji:'🐦',sound:'tweet'},
      {name:'FISH',emoji:'🐟',sound:'splash'},{name:'BEAR',emoji:'🐻',sound:'growl'},{name:'MONKEY',emoji:'🐵',sound:'oo oo aa aa'},{name:'RABBIT',emoji:'🐰',sound:'hop hop'},
      {name:'TIGER',emoji:'🐯',sound:'grrr'},{name:'HORSE',emoji:'🐴',sound:'neigh'},{name:'SHEEP',emoji:'🐑',sound:'baa'},{name:'GOAT',emoji:'🐐',sound:'maa'},
      {name:'PANDA',emoji:'🐼',sound:'munch munch'},{name:'MOUSE',emoji:'🐭',sound:'squeak'},{name:'CHICKEN',emoji:'🐔',sound:'cluck'},{name:'ELEPHANT',emoji:'🐘',sound:'trumpet'}
    ];
    let index=0, score=0, answer=[];
    document.getElementById('total').textContent=animals.length;
    function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
    function render(){
      const a=animals[index]; answer=[];
      animal.textContent=a.emoji; hint.textContent=`I say: ${a.sound}!`; number.textContent=index+1; message.textContent='Tap the letters below!';
      bar.style.width=((index)/animals.length*100)+'%';
      slots.innerHTML=''; letters.innerHTML='';
      a.name.split('').forEach(()=>{const d=document.createElement('div');d.className='slot';slots.appendChild(d)});
      const extra='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').filter(l=>!a.name.includes(l));
      const pool=shuffle([...a.name.split(''),...shuffle(extra).slice(0,Math.min(4,Math.max(2,8-a.name.length)))])
      pool.forEach(ch=>{const b=document.createElement('button');b.className='letter';b.textContent=ch;b.onclick=()=>pickLetter(b,ch);letters.appendChild(b)});
      speak(`Spell ${a.name}. ${a.name.split('').join(', ')}`);
    }
    function pickLetter(btn,ch){
      if(answer.length>=animals[index].name.length)return;
      answer.push({ch,btn}); btn.classList.add('used'); updateSlots(); speak(ch);
    }
    function updateSlots(){[...slots.children].forEach((s,i)=>s.textContent=answer[i]?.ch||'')}
    function clearAnswer(){answer.forEach(x=>x.btn.classList.remove('used'));answer=[];updateSlots();message.textContent='Try again. Tap the letters!'}
    function checkAnswer(){
      const word=answer.map(x=>x.ch).join(''); const correct=animals[index].name;
      if(word===correct){score+=10; document.getElementById('score').textContent=score; message.textContent=`Great! It is ${correct}! 🌟`; celebrate(); speak(`Great job! ${correct}`); setTimeout(nextAnimal,1400)}
      else{message.textContent='Oops! Let us spell again.'; speak('Try again'); setTimeout(clearAnswer,700)}
    }
    function nextAnimal(){index=(index+1)%animals.length; if(index===0){message.textContent='You finished all animals!';} render()}
    function speakAnimal(){const a=animals[index]; speak(`${a.name}. ${a.name.split('').join(', ')}. ${a.name}`)}
    function speak(text){
      if(!('speechSynthesis' in window))return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=.72; u.pitch=1.25; speechSynthesis.speak(u);
    }
    function celebrate(){
      for(let i=0;i<16;i++){const s=document.createElement('div');s.className='star';s.textContent=['⭐','🌈','✨','🎈'][i%4];s.style.left=Math.random()*90+'%';s.style.top=Math.random()*80+'%';stars.appendChild(s);setTimeout(()=>s.remove(),1000)}
    }
    render();
  </script>
</body>
</html>
